# Canonical WordPress stack for Dokploy. Identical for every site.
# Tunables, defaults, and the reasoning behind them: docs/wiki/WORDPRESS-STACK-TUNING.md
services:
  wordpress:
    image: wordpress:7-php8.5-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    mem_limit: ${WP_MEM_LIMIT:-384m}
    memswap_limit: ${WP_MEMSWAP_LIMIT:-768m}
    mem_reservation: ${WP_MEM_RESERVATION:-128m}
    cpus: ${WP_CPUS:-1.0}
    pids_limit: ${WP_PIDS_LIMIT:-128}
    configs:
      - source: apache_limits
        target: /etc/apache2/conf-enabled/zz-resource-limits.conf
    environment:
      - WORDPRESS_DB_HOST=db
      - WORDPRESS_DB_USER=$SERVICE_USER_WORDPRESS
      - WORDPRESS_DB_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
      - WORDPRESS_DB_NAME=wordpress
    volumes:
      - wp_content:/var/www/html/wp-content
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  db:
    image: mariadb:12
    restart: unless-stopped
    mem_limit: ${DB_MEM_LIMIT:-288m}
    memswap_limit: ${DB_MEMSWAP_LIMIT:-416m}
    mem_reservation: ${DB_MEM_RESERVATION:-96m}
    cpus: ${DB_CPUS:-0.75}
    pids_limit: ${DB_PIDS_LIMIT:-128}
    command: >-
      --innodb-buffer-pool-size=${DB_BUFFER_POOL:-128M}
      --innodb-log-file-size=64M
      --innodb-log-buffer-size=8M
      --max-connections=${DB_MAX_CONNECTIONS:-20}
      --sort-buffer-size=1M
      --join-buffer-size=1M
      --read-buffer-size=256K
      --read-rnd-buffer-size=512K
      --tmp-table-size=16M
      --max-heap-table-size=16M
      --performance-schema=OFF
      --skip-name-resolve
    environment:
      - MYSQL_DATABASE=wordpress
      - MYSQL_ROOT_PASSWORD=$SERVICE_PASSWORD_ROOT
      - MYSQL_USER=$SERVICE_USER_WORDPRESS
      - MYSQL_PASSWORD=$SERVICE_PASSWORD_WORDPRESS
    volumes:
      - db_data:/var/lib/mysql
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: ${LOG_MAX_FILE:-3}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s

configs:
  apache_limits:
    content: |
      <IfModule mpm_prefork_module>
          StartServers             ${WP_START_SERVERS:-2}
          MinSpareServers          ${WP_MIN_SPARE:-2}
          MaxSpareServers          ${WP_MAX_SPARE:-4}
          MaxRequestWorkers        ${WP_MAX_WORKERS:-8}
          ServerLimit              ${WP_MAX_WORKERS:-8}
          MaxConnectionsPerChild   ${WP_MAX_REQUESTS_PER_CHILD:-500}
      </IfModule>

      Timeout ${WP_TIMEOUT:-60}
      KeepAlive On
      MaxKeepAliveRequests 100
      KeepAliveTimeout ${WP_KEEPALIVE_TIMEOUT:-5}

volumes:
  wp_content:
  db_data:
