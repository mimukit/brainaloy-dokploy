# VPC Services that send through the brainaloy-vps-cf-tunnel tunnel.
# One line per upstream: <service-name> <base-url>
#
# - The name becomes the Cloudflare VPC Service name. Use lowercase letters, digits and dashes.
# - The URL sets the scheme, the host and the port. A path is ignored.
# - postgres://<host>:<port> makes a TCP service for Hyperdrive. Put no user or password in it.
# - http uses --http-port. https uses --https-port and verifies the certificate in full.
# - Apply changes with: ./services.sh apply
#
# Do not add an upstream that shares a CDN edge (for example a Cloudflare-hosted API) unless
# you accept that the URL host, not this file, picks the site. See README.md "Security".

egress-khudebarta http://118.67.213.114:3775
